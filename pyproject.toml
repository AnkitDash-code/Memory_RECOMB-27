[project]
name = "recomb2027"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata>=0.12.19",
    "entmax>=1.3",
    "graphst>=1.1.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pot>=0.9.7",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "scanpy>=1.11.5",
    "scikit-learn>=1.9.0",
    "scikit-misc>=0.5.2",
    "squidpy>=1.8.2",
    "torch",
    "torch-geometric>=2.8.0.post1",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# STAGATE (a real comparator) hard-imports torch_sparse in its GATConv.
# This project previously recorded STAGATE as "blocked on Windows because PyG's
# wheel index tops out at torch 2.9.1" -- that is now STALE: the index publishes
# builds through torch 2.13.0, including torch-sparse 0.6.18+pt211cu128. Pinned
# here so the environment is reproducible rather than depending on an ad-hoc
# `--find-links` install.
#
# Install these two with:
#   uv pip install torch_sparse torch_scatter \
#     --find-links "https://data.pyg.org/whl/torch-2.11.0+cu128.html"
#   uv pip install git+https://github.com/QIFEIDKN/STAGATE_pyG.git
#
# They are kept OUT of [project.dependencies] deliberately: the wheel URL is
# specific to this exact torch+CUDA build, so baking it into the resolved
# dependency set would break `uv sync` for anyone on a different torch version.
#
# Garfield is NOT installable here and this is not a stale claim: it depends on
# pybedtools -> pysam, which requires htslib and has no Windows build. That one
# genuinely needs Colab or WSL.
